<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiverse Messenger</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="black">

  <!-- AUTH SCREEN -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-card">
      <img src="assets/logo.png" class="auth-logo" alt="logo">
      <h1>MULTIVERSE MESSENGER</h1>
      <p class="sub">CONNECT &bull; CHAT &bull; SHARE &bull; EXPLORE</p>

      <div class="tabs">
        <button id="tabLogin" class="tab active" onclick="showAuthTab('login')">Log In</button>
        <button id="tabSignup" class="tab" onclick="showAuthTab('signup')">Sign Up</button>
      </div>

      <!-- LOGIN -->
      <div id="loginForm">
        <div class="field"><label>Email</label><input type="email" id="loginEmail"></div>
        <div class="field"><label>Password</label><input type="password" id="loginPassword"></div>
        <button class="primary-btn" onclick="doLogin()">Log In</button>
        <p class="error" id="loginError"></p>
      </div>

      <!-- SIGNUP -->
      <div id="signupForm" style="display:none;">
        <div class="acct-type">
          <button id="typePersonal" class="active" onclick="setAcctType('personal')">Personal</button>
          <button id="typeBusiness" onclick="setAcctType('business')">Business</button>
        </div>
        <div class="field"><label>Email</label><input type="email" id="suEmail"></div>
        <div class="field" id="displayNameField"><label>Display name</label><input type="text" id="suDisplay"></div>
        <div class="field">
          <label id="unameLabel">Username</label>
          <input type="text" id="suUsername" oninput="checkAvailability()" placeholder="jadenkosi">
          <div class="avail" id="unameAvail"></div>
        </div>
        <div class="field"><label>Password</label><input type="password" id="suPassword"></div>
        <button class="primary-btn" onclick="doSignup()">Create Account</button>
        <p class="error" id="signupError"></p>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appScreen" class="app-screen" style="display:none;">
    <header>
      <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">☰</button>
      <img src="assets/logo.png" class="hdr-logo" alt="logo">
      <div><h1>MULTIVERSE</h1><span class="sub">MESSENGER</span></div>
      <div class="theme-toggle">
        <button id="btnWhite" onclick="setTheme('white')">White &amp; Gold</button>
        <button id="btnBlack" onclick="setTheme('black')">Black &amp; Gold</button>
      </div>
      <button class="signup-btn" onclick="openProfile()">Profile</button>
      <button class="signup-btn" onclick="doLogout()">Log Out</button>
    </header>

    <main>
      <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>
      <div class="sidebar" id="sidebar">
        <div class="status-strip" id="statusStrip">
          <div class="status-item" id="myStatusItem" onclick="handleMyStatusClick()">
            <div class="status-ring me"><img id="myStatusAvatar" src="assets/logo.png"></div>
            <span>My Status</span>
            <input type="file" id="statusFileInput" accept="image/*,video/*" style="display:none" onchange="postStatus()">
          </div>
          <div id="contactStatusList" style="display:flex;gap:10px;"></div>
        </div>
        <div class="new-chat">
          <input type="text" id="addContactUsername" placeholder="Add contact @username">
          <button onclick="addContact()">Add</button>
        </div>
        <div class="new-chat">
          <input type="text" id="newChatUsername" placeholder="Start chat with @username">
          <button onclick="startChatWithUsername()">Go</button>
        </div>
        <div id="chatList"></div>
      </div>

      <div class="chat-area">
        <div class="chat-header" id="chatHeader">
          <span id="chatHeaderName">Select or start a chat</span>
          </div>
        <div class="messages" id="messages"></div>
        <div class="composer">
          <button class="icon-btn" onclick="toggleEmoji()">😊</button>
          <input id="msgInput" type="text" placeholder="Message..." onkeydown="if(event.key==='Enter')sendMsg()">
          <label class="icon-btn" title="Send photo">📎<input type="file" id="imgInput" accept="image/*" style="display:none" onchange="sendImage()"></label>
          <label class="icon-btn" title="Send video (max 10 MB)">🎥<input type="file" id="videoInput" accept="video/*" style="display:none" onchange="sendVideo()"></label>
          <button class="send-btn" onclick="sendMsg()">➤</button>
          <div class="emoji-panel" id="emojiPanel">
            <div class="emoji-tabs">
              <button class="active" onclick="showEmojiTab('std')">Emoji</button>
              <button onclick="showEmojiTab('ex')">Exclusive</button>
            </div>
            <div class="emoji-grid" id="gridStd">
              <span>😀</span><span>😂</span><span>😍</span><span>🔥</span><span>👍</span><span>🙏</span>
              <span>😊</span><span>😢</span><span>😎</span><span>🎉</span><span>❤️</span><span>👀</span>
            </div>
            <div class="emoji-grid" id="gridEx" style="display:none;">
              <span>👑</span><span>✨</span><span>🌌</span><span>💫</span><span>🔱</span><span>🪐</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- PROFILE MODAL -->
  <div class="modal-backdrop" id="profileBackdrop">
    <div class="modal">
      <button class="close-x" onclick="closeProfile()">✕</button>
      <h2>Your Profile</h2>
      <div style="text-align:center;margin-bottom:16px;">
        <img id="profilePicPreview" src="assets/logo.png" style="width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);">
        <div style="margin-top:8px;">
          <label class="signup-btn" style="display:inline-block;cursor:pointer;">
            Change Photo<input type="file" id="profilePicInput" accept="image/*" style="display:none" onchange="uploadProfilePic()">
          </label>
        </div>
      </div>
      <div class="field"><label>Display name</label><input type="text" id="profileDisplayName"></div>
      <div class="field"><label>Username</label><input type="text" id="profileUsername" disabled style="opacity:.6;"></div>
      <button class="create-btn" onclick="saveDisplayName()">Save Changes</button>
      <p class="error" id="profileError"></p>
    </div>
  </div>

  <!-- STATUS VIEWER MODAL -->
  <div class="modal-backdrop" id="statusViewerBackdrop">
    <div class="modal" style="max-width:420px;padding:0;background:#000;overflow:hidden;">
      <div style="display:flex;gap:4px;padding:8px;">
        <div id="statusProgressBars" style="display:flex;gap:4px;flex:1;"></div>
      </div>
      <button class="close-x" style="position:absolute;top:8px;right:14px;color:#fff;z-index:5;" onclick="closeStatusViewer()">✕</button>
      <div id="statusViewerName" style="color:#fff;padding:0 14px 8px;font-weight:700;font-size:.85rem;"></div>
      <div id="statusViewerMedia" style="width:100%;aspect-ratio:9/16;background:#000;display:flex;align-items:center;justify-content:center;"></div>
    </div>
  </div>

  <!-- INCOMING / ACTIVE CALL MODAL -->
  <div class="modal-backdrop" id="callBackdrop">
    <div class="modal call-modal" style="max-width:520px;padding:0;background:#000;overflow:hidden;border:none;">
      <div style="position:relative;width:100%;aspect-ratio:9/16;background:#000;display:flex;align-items:center;justify-content:center;">
        <!-- Remote stream fills the container -->
        <video id="remoteVideo" autoplay playsinline style="width:100%;height:100%;object-fit:cover;display:none;"></video>
        <!-- Remote audio only (voice call) -->
        <audio id="remoteAudio" autoplay style="display:none;"></audio>
        <!-- Local preview (video call only, small, top-right) -->
        <video id="localVideo" autoplay playsinline muted style="position:absolute;top:12px;right:12px;width:110px;height:150px;object-fit:cover;border-radius:10px;border:2px solid #d4af37;display:none;"></video>
        <!-- Caller name -->
        <div id="callPeerName" style="position:absolute;top:14px;left:16px;color:#fff;font-weight:700;font-size:.9rem;text-shadow:0 1px 4px #000;">—</div>
        <!-- Status text (Ringing / Connecting / Connected / Ended) -->
        <div id="callStatus" style="position:absolute;bottom:110px;left:0;right:0;text-align:center;color:#fff;font-size:.85rem;opacity:.85;">—</div>
        <!-- Controls -->
        <div style="position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:center;gap:14px;">
          <button id="btnAnswerCall" class="icon-btn" onclick="answerCall()" style="background:#2ecc71;color:#fff;border-radius:50%;width:52px;height:52px;font-size:1.3rem;display:none;">📞</button>
          <button id="btnMuteCall" class="icon-btn" onclick="toggleMute()" style="background:rgba(255,255,255,.15);color:#fff;border-radius:50%;width:52px;height:52px;font-size:1.3rem;">🎤</button>
          <button id="btnCameraCall" class="icon-btn" onclick="toggleCamera()" style="background:rgba(255,255,255,.15);color:#fff;border-radius:50%;width:52px;height:52px;font-size:1.3rem;display:none;">📷</button>
          <button id="btnEndCall" class="icon-btn" onclick="endCall()" style="background:#e74c3c;color:#fff;border-radius:50%;width:52px;height:52px;font-size:1.3rem;">📵</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
